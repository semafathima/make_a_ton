{% extends "auth_base.html" %}
{% block title %}Log in - Subscription Manager{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="row g-0">
    <div class="col-md-5 auth-side">
      <h2>Welcome back.</h2>
      <p class="mt-3">Log in to see your plans, upcoming renewals and invoices.</p>
    </div>
    <div class="col-md-7 auth-form">
      <h1 class="mb-1">Log in</h1>
      <p class="text-muted mb-4">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>

      <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required autofocus>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember" name="remember">
          <label class="form-check-label" for="remember">Keep me logged in</label>
        </div>

        <button type="submit" class="btn btn-brand w-100 py-2">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
